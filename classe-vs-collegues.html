<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classe contre collègues</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* Mise en page : un stade de nuit sur grand écran. Bandeau tableau d'affichage, piste de 50 couloirs fins à gauche, leaders en direct à droite. Thème unique sombre, voulu pour le projecteur. */
:root {
  --night: #0b1130;
  --stand: #141c45;
  --line: #2a3570;
  --ink: #f3f5ff;
  --soft: #9ba6d6;
  --track: #b5462e;
  --track-2: #a33f29;
  --gold: #ffc928;
  --mint: #3ee6a0;
  --cl: #ff5c8a;
  --co: #3d9bff;
  --board: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
.app { max-width: 1500px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.title { display: grid; gap: 2px; }
.kicker { font-weight: 800; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 0; font-family: var(--board); font-weight: 900; text-transform: uppercase; font-size: clamp(2rem, 5vw, 3.6rem); line-height: .9; }
.score { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.lampS { width: 30px; height: 30px; border-radius: 50%; background: #26306a; border: 3px solid var(--line); }
.lampS.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 22px 8px rgba(255,201,40,.55); }
.clock { font-family: var(--board); font-weight: 900; font-size: clamp(2.4rem, 5vw, 3.8rem); color: var(--gold); font-variant-numeric: tabular-nums; min-width: 4.2ch; line-height: 1; }
.mode { font-weight: 800; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); min-width: 13ch; }
.mode.hot { color: var(--gold); }
button { font: inherit; font-weight: 800; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--ink); padding: 10px 20px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.go { background: var(--gold); color: #1d1500; border-color: var(--gold); font-size: 1.1rem; padding: 12px 26px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; }
@media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.trackWrap { position: relative; background: var(--track); border-radius: 16px; padding: 10px 46px 10px 12px; min-width: 0; height: max(520px, calc(100vh - 170px)); }
.lanes { position: absolute; inset: 10px 46px 10px 12px; background: repeating-linear-gradient(var(--track) 0 calc(var(--lh) - 1px), rgba(255,255,255,.35) calc(var(--lh) - 1px) var(--lh)); }
.startL { position: absolute; top: 10px; bottom: 10px; left: 12px; width: 3px; background: #fff; }
.finishL { position: absolute; top: 10px; bottom: 10px; right: 34px; width: 12px; background: repeating-conic-gradient(#fff 0 25%, #10172e 0 50%) 0 0 / 12px 12px; }
.dot { position: absolute; left: 12px; width: var(--ds); height: var(--ds); margin: calc(var(--ds) / -2) 0 0 calc(var(--ds) / -2); border-radius: 50%; border: 1.5px solid #fff; will-change: transform; transition: width .3s, height .3s; }
.dot.m1 { background: var(--gold) !important; z-index: 3; box-shadow: 0 0 8px 2px rgba(255,201,40,.7); }
.dot.m2 { background: #d9e0ff !important; z-index: 3; box-shadow: 0 0 8px 2px rgba(217,224,255,.6); }
.dot.m3 { background: #e39a62 !important; z-index: 3; box-shadow: 0 0 8px 2px rgba(227,154,98,.6); }
.tagD .st { color: var(--gold); margin-right: 4px; }
.dot.fast { --ds: 22px !important; background: var(--mint) !important; z-index: 3; box-shadow: 0 0 14px 4px rgba(62,230,160,.6); }
.tagD { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: #10172e; color: var(--ink); font-weight: 800; font-size: .85rem; padding: 1px 8px; border-radius: 6px; z-index: 4; }
.tagD .rk { color: var(--gold); margin-right: 4px; }
.dot.flip .tagD { left: auto; right: calc(100% + 6px); }
.dot.top { z-index: 2; }

.side { background: var(--stand); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.side h2 { margin: 0; font-family: var(--board); font-weight: 900; text-transform: uppercase; font-size: 1.5rem; }
.lead { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.lead li { display: grid; grid-template-columns: 26px 12px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.04); font-weight: 800; }
.lead li .r { font-family: var(--board); font-size: 1.2rem; color: var(--soft); text-align: right; }
.lead li:first-child .r { color: var(--gold); }
.lead li .c { width: 12px; height: 12px; border-radius: 50%; }
.lead li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lead li .v { color: var(--soft); font-size: .85rem; font-variant-numeric: tabular-nums; }
.note { color: var(--soft); font-size: .85rem; }

.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 620px); background: rgba(11,17,48,.94); border: 3px solid var(--gold); border-radius: 20px; padding: 22px 24px; display: grid; gap: 14px; text-align: center; z-index: 10; }
.banner .bk { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-size: .85rem; }
.banner .bt { font-family: var(--board); font-weight: 900; text-transform: uppercase; font-size: clamp(2rem, 5vw, 3.4rem); line-height: .95; }
.banner .bs { color: var(--soft); font-weight: 700; font-size: 1.1rem; }
.banner .btns { justify-content: center; }

.results { background: var(--stand); border-radius: 16px; padding: 18px; display: grid; gap: 16px; }
.results h2 { margin: 0; font-family: var(--board); font-weight: 900; text-transform: uppercase; font-size: 2rem; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; max-width: 720px; }
.step { border-radius: 14px 14px 4px 4px; padding: 14px 10px; text-align: center; display: grid; gap: 4px; }
.step b { font-family: var(--board); font-weight: 900; font-size: clamp(1.4rem, 3.4vw, 2.2rem); text-transform: uppercase; overflow-wrap: anywhere; line-height: 1; }
.step span { font-weight: 800; }
.step .pl { font-family: var(--board); font-size: 2.6rem; line-height: 1; }
.s1 { background: var(--gold); color: #1d1500; min-height: 190px; order: 2; }
.s2 { background: #c9d2f5; color: #141c45; min-height: 150px; order: 1; }
.s3 { background: #e39a62; color: #2a1405; min-height: 120px; order: 3; }
.full { list-style: none; margin: 0; padding: 0; columns: 3 220px; column-gap: 18px; }
.full li { break-inside: avoid; display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.full li .r { width: 2.4em; text-align: right; color: var(--soft); font-variant-numeric: tabular-nums; }
.full li .tm { margin-left: auto; color: var(--soft); font-variant-numeric: tabular-nums; }
.dq { color: #ff9db3; font-weight: 800; }
.teams { display: flex; flex-wrap: wrap; gap: 6px 18px; font-weight: 800; margin-top: 6px; }
.teams span { display: inline-flex; align-items: center; gap: 6px; }
.teams i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
.tm1 i { background: var(--cl); } .tm2 i { background: var(--co); }
.teams b { color: var(--soft); font-weight: 700; }
.tagD.t1 { box-shadow: inset 4px 0 0 var(--cl); padding-left: 10px; }
.tagD.t2 { box-shadow: inset 4px 0 0 var(--co); padding-left: 10px; }
.tbl { border-collapse: collapse; font-weight: 800; font-size: 1.1rem; max-width: 640px; width: 100%; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--soft); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
.tbl tr.win td:first-child::after { content: "  ★"; color: var(--gold); }
.full li .tc { width: 10px; height: 10px; border-radius: 50%; align-self: center; flex: none; }
.netErr { background: #5a1830; color: #ffd6e0; border-radius: 12px; padding: 10px 14px; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>
</head>

  var DQ = {"n":"Antoine","t":[318,394,494,587,654,756,823,939,1007,1120,1187,1301,1372,1478,1546,1653,1728,1840,1912,2016,2082,2195,2263,2372,2451,2554,2631,2733,2796,2914]};
  var N = 30, CL = "#ff5c8a", CO = "#3d9bff", TEAM = { 1: "Ma classe", 2: "Mes collègues" };
  var API = "/api/resultats";
  var $ = function (id) { return document.getElementById(id); };
  function fmt(v, d) { return v.toFixed(d).replace(".", ","); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // Les élèves : test 1 (départ) + test 2 (cibles), lus en direct, jumelés par téléphone comme sur le tableau
  function list(c) { return fetch(API + "?classe=" + encodeURIComponent(c), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) { return d.results || []; }); }
  function ok(r) { return r && Array.isArray(r.taps) && r.taps.length >= N && r.name; }
  Promise.all([list("COURS"), list("COURS2")]).then(function (ls) {
    var by2 = {}; ls[1].forEach(function (r) { if (ok(r)) by2[r.id] = r; });
    var cls = [];
    ls[0].forEach(function (r) { if (!r || !Array.isArray(r.taps) || !r.taps.length || !r.name || !by2[r.id]) return; var d = r.taps[0]; cls.push({ n: String(r.name).slice(0, 24), t: by2[r.id].taps.slice(0, N).map(function (x) { return d + x; }) }); });
    start(cls);
  }).catch(function () {
    $("netErr").hidden = false; $("netErr").textContent = "Impossible de lire les résultats de la classe. Vérifie la connexion, puis recharge la page.";
    $("playBtn").textContent = "Pas de données";
  });

  // Même groupe que le nuage « Mes collègues (23 adultes) » : sans les plus de 40 ans, l'enfant et Pierrick (test 1 non valide)
  var HORS = ["Sophie", "Robert", "Xuan", "Charlotte", "Pierrick"];
  RUNNERS = RUNNERS.filter(function (r) { return HORS.indexOf(r.n) < 0; });
  function start(CLASS) {
  if (!CLASS.length) { $("netErr").hidden = false; $("netErr").textContent = "Personne de la classe n'a encore terminé les deux tests."; $("playBtn").textContent = "En attente"; return; }
  $("playBtn").disabled = false; $("playBtn").textContent = "Lancer la course";
  $("nCl").textContent = CLASS.length; $("nCo").textContent = RUNNERS.length;
  var R = CLASS.map(function (r) { r.team = 1; return r; }).concat(RUNNERS.map(function (r) { r.team = 2; return r; })).map(function (r) {
    var t = r.t; return { name: r.n, team: r.team, t: t, rt: t[0], arr: t[N - 1], cad: (N - 1) / ((t[N - 1] - t[0]) / 1000), color: r.team === 1 ? CL : CO };
  });
  // ordre des couloirs mélangé (stable) pour ne rien révéler
  R.sort(function (a, b) { return (a.name.charCodeAt(0) * 7 + a.t[3]) % 97 - (b.name.charCodeAt(0) * 7 + b.t[3]) % 97; });
  var best = R.reduce(function (a, b) { return b.rt < a.rt ? b : a; });
  var fast = R.reduce(function (a, b) { return b.cad > a.cad ? b : a; });
  var byArr = R.slice().sort(function (a, b) { return a.arr - b.arr; });

  var wrap = $("trackWrap"), lanesEl = $("lanes"), dotsEl = $("dots"), W = 0, H = 0, lh = 10;
  dotsEl.innerHTML = R.map(function (r, i) { return '<div class="dot" id="d' + i + '" style="background:' + r.color + '"></div>'; }).join("");
  R.forEach(function (r, i) { r.el = $("d" + i); });
  // Mesure de la piste. On la refait à chaque image : certains navigateurs (ex. celui de Messenger)
  // changent la taille de la page sans prévenir, ce qui faisait « reculer » tout le monde.
  function measure() {
    W = lanesEl.clientWidth; H = lanesEl.clientHeight; lh = H / R.length;
    wrap.style.setProperty("--lh", lh + "px");
    var ds = Math.max(7, Math.min(16, lh - 2));
    R.forEach(function (r, i) { r.el.style.setProperty("--ds", ds + "px"); r.el.style.top = (10 + lh * (i + .5)) + "px"; });
  }
  function layout() { measure(); draw(lastT); }
  // L'étiquette reste à droite du point tant qu'elle a la place ; elle passe à gauche seulement près de l'arrivée
  function flipIfNeeded(r) {
    var tag = r.el.firstChild, x = r.p * W;
    var room = W + 30; // la piste + la zone d'arrivée
    var need = tag ? x + 14 + tag.offsetWidth : 0;
    r.el.classList.toggle("flip", !!tag && (need > room || r.p >= 1));
  }
  function pos(r, t) {
    var a = r.t; if (t < a[0]) return 0;
    var k = 0; while (k < N && a[k] <= t) k++;
    if (k >= N) return 1;
    return (k + (t - a[k - 1]) / (a[k] - a[k - 1])) / N;
  }
  var lastT = -1, lastLead = 0;
  function draw(t) {
    lastT = t;
    if (lanesEl.clientWidth !== W || lanesEl.clientHeight !== H) measure();

    $("clock").textContent = fmt(Math.max(0, t) / 1000, 2);
    R.forEach(function (r) { r.p = pos(r, t); r.el.style.transform = "translateX(" + Math.round(r.p * W) + "px)"; flipIfNeeded(r); });
    var now = performance.now();
    if (now - lastLead > 120 || t < 0) { lastLead = now; renderLead(t); }
  }
  function renderLead(t) {
    var all = R.slice().sort(function (a, b) {
      var fa = t >= a.arr, fb = t >= b.arr;
      if (fa && fb) return a.arr - b.arr; if (fa) return -1; if (fb) return 1;
      return b.p - a.p || a.rt - b.rt;
    });
    var s = all.slice(0, 10);
    $("lead").innerHTML = t < 0 ? '<li><span class="r">—</span><span></span><span class="nm">En attente du départ</span><span></span></li>' : s.map(function (r, i) {
      var v = t >= r.arr ? fmt(r.arr / 1000, 2) + " s" : Math.min(N, Math.floor(r.p * N)) + "/30";
      return '<li><span class="r">' + (i + 1) + '</span><span class="c" style="background:' + r.color + '"></span><span class="nm">' + esc(r.name) + '</span><span class="v">' + v + "</span></li>";
    }).join("");
    // étiquettes : les 5 premiers encore en course + le podium déjà arrivé
    var running = all.filter(function (r) { return t < r.arr; }).slice(0, 5);
    // seul le dernier arrivé garde son nom, le temps que le suivant franchisse la ligne
    var arrived = R.filter(function (r) { return t >= r.arr; }).sort(function (a, b) { return a.arr - b.arr; });
    var lastIn = arrived.length ? [arrived[arrived.length - 1]] : [];
    updateTags(t < 0 ? [] : lastIn.concat(running), all);
    var fin = R.filter(function (r) { return t >= r.arr; }).length;
    $("count").textContent = R.length + " coureurs · " + fin + " arrivé" + (fin > 1 ? "s" : "");
  }
  function setMode(txt, hot) { var m = $("mode"); m.textContent = txt; m.classList.toggle("hot", !!hot); }
  function updateTags(top, all) {
    R.forEach(function (r) {
      var i = top.indexOf(r), html = "";
      if (startPause) { i = -1; if (r.mark) html = '<span class="tagD t' + r.team + '"><span class="rk">' + (r.mark === 1 ? "1er" : r.mark + "e") + ' départ</span>' + esc(r.name) + "</span>"; }
      else if (i >= 0) html = '<span class="tagD t' + r.team + '"><span class="rk">' + (all.indexOf(r) + 1) + '</span>' + esc(r.name) + "</span>";
      if (r.tagHtml !== html) { r.tagHtml = html; r.el.innerHTML = html; flipIfNeeded(r); }
      r.el.classList.toggle("top", i >= 0);
    });
  }
  var startPause = false;
  function clearMarks() { R.forEach(function (r) { r.el.classList.remove("m1", "m2", "m3", "top"); r.mark = false; r.tagHtml = ""; r.el.innerHTML = ""; }); }

  var raf = 0, resume = null;
  function banner(k, title, sub, next, btn) {
    cancelAnimationFrame(raf);
    $("bk").textContent = k; $("bt").textContent = title; $("bs").textContent = sub || "";
    $("contBtn").textContent = btn || "Continuer"; $("contBtn").hidden = !next;
    $("banner").hidden = false; resume = next;
  }
  $("contBtn").addEventListener("click", function () { $("banner").hidden = true; var f = resume; resume = null; if (f) f(); });

  var runId = 0;
  function play(real) {
    var myRun = ++runId;
    cancelAnimationFrame(raf); clearMarks(); $("results").hidden = true; $("banner").hidden = true;
    var startEnd = Math.max.apply(null, R.map(function (r) { return r.rt; })) + 150;
    var midT = Math.min.apply(null, R.map(function (r) { return r.t[N / 2 - 1]; }));
    var endT = byArr[byArr.length - 1].arr + 400;
    var t = -1200, prev = null, p1 = false, p2 = false, ARR_GAP = 1300;

      if (prev == null) prev = now;

      else if (t < byArr[0].arr - 300) { rate = 1 / 3.5; setMode("Ralenti", false); }
      else {
        // Arrivées : on laisse au moins ARR_GAP ms d'écran entre deux coureurs qui franchissent la ligne
        var prevA = -Infinity, nextA = null;
        for (var k = 0; k < byArr.length; k++) { if (byArr[k].arr <= t) prevA = byArr[k].arr; else { nextA = byArr[k].arr; break; } }
        if (nextA == null) rate = 1 / 4;
        else { var g = nextA - Math.max(prevA, byArr[0].arr - 300); rate = Math.max(1 / 60, Math.min(1 / 4, g / ARR_GAP)); }
        setMode("Arrivées au ralenti", true);
      }
      t += dt * rate;
      if (myRun !== runId) return; // une ancienne course ne doit plus rien dessiner
      if (!real && !p1 && t >= startEnd) {
        t = startEnd; p1 = true;
        var top3 = R.slice().sort(function (a, b) { return a.rt - b.rt; }).slice(0, 3);
        top3.forEach(function (r, i) { r.mark = i + 1; r.tagHtml = null; r.el.classList.add("m" + (i + 1)); });
        startPause = true; draw(t); renderLead(t);
        banner("Tout le monde est parti!", "Meilleur départ : " + best.name,
          top3.map(function (r, i) { return (i + 1) + ". " + r.name + " (" + r.rt + " ms)"; }).join("  ·  "),
          function () { startPause = false; clearMarks(); go(); }); return;
      }
      draw(t);
      if (t < endT) { raf = requestAnimationFrame(step); return; }
      setMode("Arrivée!", true); draw(endT); showResults();
    }
    banner("Annonce officielle", DQ.n + " (collègues) est disqualifié", "Motif : dopage, deux doigts aux cibles!", function () {
      banner("Départ", "À vos marques… prêts…", "Le signal lumineux arrive", go, "Partez!");
    }, "Compris!");
  }
  function med(a) { a = a.slice().sort(function (x, y) { return x - y; }); var n = a.length; return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2; }
  function teamStats(k) {
    var m = R.filter(function (r) { return r.team === k; });
    var top10 = byArr.slice(0, 10).filter(function (r) { return r.team === k; }).length;
    return { k: k, n: m.length, rt: med(m.map(function (r) { return r.rt; })), cad: med(m.map(function (r) { return r.cad; })), arr: med(m.map(function (r) { return r.arr; })), top10: top10 };
  }

    var w = byArr[0], A = teamStats(1), B = teamStats(2), win = A.arr <= B.arr ? A : B, lose = win === A ? B : A;

      return '<div class="step s' + (i + 1) + '"><span class="pl">' + (i + 1) + "</span><b>" + esc(r.name) + "</b><span>" + fmt(r.arr / 1000, 2) + " s</span></div>";

      return '<li><span class="r">' + (i + 1) + '.</span><span class="tc" style="background:' + r.color + '"></span><span>' + esc(r.name) + '</span><span class="tm">' + fmt(r.arr / 1000, 2) + " s</span></li>";
    }).join("") + '<li class="dq"><span class="r">DQ</span><span>' + esc(DQ.n) + '</span><span class="tm">dopage</span></li>';
    $("results").hidden = false;
  }
  $("playBtn").addEventListener("click", function () { play(false); });
  $("realBtn").addEventListener("click", function () { play(true); });
  window.addEventListener("resize", layout);
  layout(); renderLead(-1);
  }
})();
